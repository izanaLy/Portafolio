<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help Desk Portal</title>
<style>
:root{--bg:#f6f5fa;--ink:#24202f;--muted:#5d5870;--card:#fff;--line:#d9d5e6;--accent:#4b3a8f;--p1:#a3162a;--p2:#8a4b00;--p3:#1f5c8a;--p4:#4d4d5c}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header,main{max-width:1100px;margin:0 auto;padding:16px}header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}@media(max-width:800px){.grid{grid-template-columns:minmax(0,1fr)}}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}h2{margin:0 0 12px;font-size:1.1rem}
label{display:block;margin:0 0 12px;font-weight:600}input,textarea,select{display:block;width:100%;margin-top:4px;padding:10px;font:inherit;border:1px solid #8a859c;border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}button.ghost{background:#fff;color:var(--accent)}
:focus-visible{outline:3px solid #7b5fe0;outline-offset:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.filters button[aria-pressed=true]{background:var(--accent);color:#fff}.filters button{background:#fff;color:var(--accent)}
.ticket{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:8px;padding:10px;background:#fff;color:var(--ink);border:1px solid var(--line);min-height:56px}
.ticket[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.badge{flex:none;min-width:40px;text-align:center;padding:2px 8px;border-radius:99px;color:#fff;font-weight:700}.P1{background:var(--p1)}.P2{background:var(--p2)}.P3{background:var(--p3)}.P4{background:var(--p4)}
small,.muted{color:var(--muted)}ul{padding-left:20px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}.msg{min-height:1.5em;margin:8px 0 0}.msg.err{color:var(--p1)}
.event{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;overflow-wrap:anywhere}
</style></head>
<body>
<header><h1>Help Desk Portal</h1><p>Demo local con datos ficticios. Cada ticket se clasifica con el motor de IT-05. No ingreses datos reales.</p></header>
<main><div class="grid">
<div>
<section aria-labelledby="h-new"><h2 id="h-new">Nuevo ticket</h2>
<form id="new" novalidate>
<label>Título<input name="title" maxlength="180" required></label>
<label>Descripción<textarea name="description" rows="4" maxlength="3000" required></textarea></label>
<div class="row"><label>Personas afectadas<input name="affected_users" type="number" min="1" max="1000000" value="1"></label>
<label>Alternativa temporal<select name="workaround_available"><option value="">No se sabe</option><option value="false">No disponible</option><option value="true">Disponible</option></select></label></div>
<button type="submit">Enviar ticket</button><p id="new-msg" class="msg" role="status"></p></form></section>
<section style="margin-top:16px" aria-labelledby="h-q"><h2 id="h-q">Cola de tickets <small id="count"></small></h2>
<div class="filters" id="filters" aria-label="Filtrar por prioridad"></div>
<div id="list"></div></section>
</div>
<section id="detail" aria-live="polite" aria-label="Detalle del ticket"><p class="muted">Elegí un ticket de la cola.</p></section>
</div></main>
<script src="app.js"></script>
</body></html>
